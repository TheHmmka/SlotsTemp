<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Slots2</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <style>
    :root { --app-w: 100vw; --app-h: 100vh; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: var(--app-h);
      overflow: hidden;
      background: black;
      touch-action: none;
    }

    /* Canvas прибит к низу, занимает видимый viewport */
    #unity-canvas {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: var(--app-w);
      height: var(--app-h);
      display: block;
      background: black;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    #loading-overlay{
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.65);
      z-index: 9999;
      opacity: 1;
      transition: opacity .25s ease;
      pointer-events: all;
    }
    #loading-overlay.hidden{
      opacity: 0;
      pointer-events: none;
    }
    .spinner{
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 5px solid rgba(255,255,255,0.22);
      border-top-color: rgba(255,255,255,0.95);
      animation: spin .9s linear infinite;
    }
    @keyframes spin{ to { transform: rotate(360deg); } }
    .loading-text{
      font: 600 16px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color: rgba(255,255,255,0.95);
    }
    .loading-subtext{
      font: 400 13px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color: rgba(255,255,255,0.7);
      max-width: 80vw;
      text-align: center;
    }
  </style>
</head>

<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <div id="loading-overlay" aria-live="polite">
    <div class="spinner" role="status" aria-label="Loading"></div>
    <div class="loading-text">Loading…</div>
    <div class="loading-subtext" id="loading-subtext"></div>
  </div>

  <script>
    // -------------------------
    //  Build paths
    // -------------------------
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/Web.loader.js";

    const canvas = document.getElementById("unity-canvas");
    const overlay = document.getElementById("loading-overlay");
    const overlaySub = document.getElementById("loading-subtext");

    // -------------------------
    //  Host bridge (WKWebView / fallback)
    // -------------------------
    window.sendToHost = function(type, payload) {
      const message = {
        type,
        payload: (payload !== undefined && payload !== null) ? payload : null,
        ts: Date.now()
      };

      // WKWebView
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.unity) {
        window.webkit.messageHandlers.unity.postMessage(message);
        return;
      }

      // Optional generic bridge
      if (window.unity && window.unity.postMessage) {
        window.unity.postMessage(JSON.stringify(message));
        return;
      }

      console.log("[HostEvent]", message);
    };

    // -------------------------
    //  Loading UI
    // -------------------------
    function showLoading(text) {
      if (overlaySub) overlaySub.textContent = text || "";
      overlay && overlay.classList.remove("hidden");
    }

    function hideLoading() {
      overlay && overlay.classList.add("hidden");
      setTimeout(() => overlay && overlay.remove(), 300);
    }

    showLoading("");

    // -------------------------
    //  Init params from URL
    // -------------------------
    function getInitParams() {
      const url = new URL(window.location.href);
      const currency = url.searchParams.get("currency") || "EUR";

      const balanceStr = url.searchParams.get("balance") || "0";
      const betStr = url.searchParams.get("bet") || "0";

      const balance = Number(balanceStr);
      const bet = Number(betStr);

      return {
        currency,
        balance: Number.isFinite(balance) ? balance : 0,
        bet: Number.isFinite(bet) ? bet : 0
      };
    }

    const initParams = getInitParams();

    // -------------------------
    //  Viewport measurement (WKWebView safe)
    // -------------------------
    function getViewportCSSSize() {
      // На iOS WKWebView наиболее стабильна visualViewport
      const vv = window.visualViewport;

      const w = vv ? Math.round(vv.width)  : Math.round(window.innerWidth);
      const h = vv ? Math.round(vv.height) : Math.round(window.innerHeight);

      // safety
      return {
        w: Math.max(1, w),
        h: Math.max(1, h)
      };
    }

    // -------------------------
    //  Apply CSS vars + resize canvas
    //  (важно: выставляем и CSS size, и pixel buffer)
    // -------------------------
    function applyLayout() {
      const dpr = window.devicePixelRatio || 1;
      const { w: wCss, h: hCss } = getViewportCSSSize();

      // CSS vars: чтобы html/body/canvas жили одной высотой
      document.documentElement.style.setProperty("--app-w", wCss + "px");
      document.documentElement.style.setProperty("--app-h", hCss + "px");

      // ЯВНО фиксируем CSS размер canvas (важно для Unity/DOM согласованности)
      canvas.style.width = wCss + "px";
      canvas.style.height = hCss + "px";

      // Pixel buffer (device pixels) — для четкости
      const wPx = Math.floor(wCss * dpr);
      const hPx = Math.floor(hCss * dpr);

      if (canvas.width !== wPx || canvas.height !== hPx) {
        canvas.width = wPx;
        canvas.height = hPx;
      }

      // (опционально) лог в хост для диагностики
      // window.sendToHost("Viewport", { wCss, hCss, wPx, hPx, dpr });
    }

    // -------------------------
    //  Prime sync: несколько прогревов
    //  (WKWebView часто меняет viewport через 1-3 кадра)
    // -------------------------
    function primeSync() {
      applyLayout();
      requestAnimationFrame(() => applyLayout());
      requestAnimationFrame(() => applyLayout());
      setTimeout(() => applyLayout(), 50);
      setTimeout(() => applyLayout(), 250);
    }

    // События
    window.addEventListener("resize", applyLayout);
    window.addEventListener("orientationchange", primeSync);

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", applyLayout);
      window.visualViewport.addEventListener("scroll", applyLayout);
    }

    // Дополнительные точки синхронизации (полезно в WKWebView)
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) primeSync();
    });

    document.addEventListener("DOMContentLoaded", primeSync, { once: true });
    window.addEventListener("load", primeSync);

    // Первичная синхронизация сразу
    primeSync();

    // -------------------------
    //  Unity config
    // -------------------------
    const config = {
      arguments: [],
      dataUrl: buildUrl + "/Web.data",
      frameworkUrl: buildUrl + "/Web.framework.js",
      codeUrl: buildUrl + "/Web.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Slots2",
      productVersion: "1.5.0",
      // matchWebGLToCanvasSize: true, // можно включить в новых версиях Unity (если поддерживается)
    };

    // -------------------------
    //  Load loader.js and create instance
    // -------------------------
    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      if (typeof createUnityInstance !== "function") {
        console.error("createUnityInstance is not defined");
        showLoading("Loader error");
        window.sendToHost("error", "createUnityInstance is not defined");
        return;
      }

      // ВАЖНО: ещё раз выровнять layout ПЕРЕД стартом Unity
      primeSync();

      createUnityInstance(canvas, config).then((unityInstance) => {
        window.unityInstance = unityInstance;

        // Ещё раз после старта Unity (Unity может повлиять на layout)
        primeSync();

        // Init params -> Unity
        const payload = JSON.stringify(initParams);
        try { unityInstance.SendMessage("Bridge", "ApplyInitParams", payload); } catch (e) {}

        hideLoading();

      }).catch((err) => {
        console.error(err);
        showLoading("Failed to init game");
        window.sendToHost("error", String(err));
      });
    };

    script.onerror = () => {
      showLoading("Failed to load loader");
      window.sendToHost("error", "Failed to load Unity loader");
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
