<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Slots2</title>

  <!-- Лучше сразу в head, а не динамически -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <style>
    :root {
      --app-height: 100vh;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: var(--app-height);
      overflow: hidden;
      background: black;
    }

    /* Canvas прибит к низу и занимает видимый viewport по высоте */
    #unity-canvas {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      /* <-- прибили к низу */
      width: 100%;
      height: var(--app-height);
      /* <-- высота видимого viewport */
      display: block;
      background: black;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.65);
      z-index: 9999;
      opacity: 1;
      transition: opacity .25s ease;
      pointer-events: all;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 5px solid rgba(255, 255, 255, 0.22);
      border-top-color: rgba(255, 255, 255, 0.95);
      animation: spin .9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      font: 600 16px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color: rgba(255, 255, 255, 0.95);
    }

    .loading-subtext {
      font: 400 13px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color: rgba(255, 255, 255, 0.7);
      max-width: 80vw;
      text-align: center;
    }
  </style>
</head>

<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <div id="loading-overlay" aria-live="polite">
    <div class="spinner" role="status" aria-label="Loading"></div>
    <div class="loading-text">Loading…</div>
    <div class="loading-subtext" id="loading-subtext"></div>
  </div>

  <script>
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/Web3.loader.js";

    const canvas = document.getElementById("unity-canvas");

    // ---- helper: реальная высота видимого viewport (важно для iOS/WKWebView) ----
    function viewportHeight() {
      // visualViewport максимально стабилен на iOS
      return window.visualViewport ? Math.round(window.visualViewport.height) : Math.round(window.innerHeight);
    }

    function setAppHeight() {
      const h = viewportHeight();
      document.documentElement.style.setProperty("--app-height", h + "px");
    }

    // ---- сообщения в хост ----
    window.sendToHost = function (type, payload) {
      var message = {
        type: type,
        payload: (payload !== undefined && payload !== null) ? payload : null,
        ts: Date.now()
      };

      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.unity) {
        window.webkit.messageHandlers.unity.postMessage(message);
        return;
      }

      if (window.unity && window.unity.postMessage) {
        window.unity.postMessage(JSON.stringify(message));
        return;
      }
      
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(message, '*');
        return;
      }

      console.log("[HostEvent]", message);
    };

    function getInitParams() {
      const url = new URL(window.location.href);
      const readNumberParam = (names, fallback = 0) => {
        for (const name of names) {
          const raw = url.searchParams.get(name);
          if (raw === null || raw === "") continue;

          const normalized = String(raw).trim().replace(",", ".");
          const parsed = Number(normalized);
          if (Number.isFinite(parsed)) return parsed;
        }

        return fallback;
      };

      const currency = url.searchParams.get("currency") || "EUR";
      const balance = readNumberParam(["balance"]);
      const bet = readNumberParam(["bet"]);
      const winCoins = readNumberParam(["winCoins", "winAmount", "win_coins", "win_amount", "payout", "win"]);
      const winSpinNum = Math.round(readNumberParam(["winSpinNum", "win_spin_num"]));

      return {
        currency,
        balance,
        bet,
        winCoins,
        winSpinNum
      };
    }

    // // (опционально) фон из Splash Image
    // const bgName = "Web3.jpg";
    // if (bgName && bgName.length > 0) {
    //   canvas.style.background = "url('" + buildUrl + "/" + bgName.replace(/'/g, "%27") + "') center / cover";
    // }

    const initParams = getInitParams();

    const config = {
      arguments: [],
      dataUrl: buildUrl + "/Web3.data",
      frameworkUrl: buildUrl + "/Web3.framework.js",
      codeUrl: buildUrl + "/Web3.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Slots2",
      productVersion: "1.5.0",
    };

    const overlay = document.getElementById("loading-overlay");
    const overlaySub = document.getElementById("loading-subtext");

    function showLoading(text) {
      if (overlaySub) overlaySub.textContent = text || "";
      overlay && overlay.classList.remove("hidden");
    }

    function hideLoading() {
      overlay && overlay.classList.add("hidden");
      setTimeout(() => overlay && overlay.remove(), 300);
    }

    showLoading("");

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const wCss = Math.round(window.innerWidth);
      const hCss = viewportHeight();

      // Размер в device pixels (важно для четкости)
      const w = Math.floor(wCss * dpr);
      const h = Math.floor(hCss * dpr);

      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
    }

    // синхронизация высоты + canvas
    function syncLayout() {
      setAppHeight();
      resizeCanvas();
    }

    // Прогрев: iOS часто пересчитывает viewport через кадр/два
    function primeSync() {
      syncLayout();
      requestAnimationFrame(syncLayout);
      setTimeout(syncLayout, 50);
      setTimeout(syncLayout, 250);
    }

    window.addEventListener("resize", syncLayout);
    window.addEventListener("orientationchange", primeSync);

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", syncLayout);
      window.visualViewport.addEventListener("scroll", syncLayout);
    }

    // сначала прибиваем layout
    primeSync();

    // грузим loader.js
    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      if (typeof createUnityInstance !== "function") {
        console.error("createUnityInstance is not defined");
        showLoading("Loader error");
        window.sendToHost("error", "createUnityInstance is not defined");
        return;
      }

      createUnityInstance(canvas, config).then((unityInstance) => {
        window.unityInstance = unityInstance;

        // еще раз после инициализации Unity
        primeSync();

        const payload = JSON.stringify(initParams);
        try { unityInstance.SendMessage("Bridge", "ApplyInitParams", payload); } catch (e) { }

        hideLoading();
      }).catch((err) => {
        console.error(err);
        showLoading("Failed to init game");
        window.sendToHost("error", String(err));
      });
    };

    script.onerror = () => {
      showLoading("Failed to load loader");
      window.sendToHost("error", "Failed to load Unity loader");
    };

    document.body.appendChild(script);
  </script>
</body>

</html>
